# SAgent 配置示例
# 复制本文件为 config.yaml 并按需修改。
# 说明：api_key 与 base_url 也可通过环境变量覆盖：
#   LLM_API_KEY 覆盖 llm.api_key
#   LLM_API_URL 覆盖 llm.base_url（用于对接 OpenAI 兼容的其他 LLM 服务）
# context 段为可选配置，缺省时使用默认值

llm:
  # 模型名称，例如 gpt-4o-mini、deepseek-chat、qwen-plus 等
  model: "gpt-4o-mini"
  # API Key（建议通过环境变量 LLM_API_KEY 设置，避免明文入库）
  api_key: ""
  # OpenAI 兼容 API 的基础地址；使用官方 OpenAI 时可留空
  # 例如 DeepSeek: https://api.deepseek.com/v1
  base_url: ""
  # 采样温度
  temperature: 0.7
  # 请求超时时间（秒）
  timeout: 60

agent:
  # 默认执行模式：react 或 plan
  mode: "react"
  # ReAct 循环最大迭代次数
  max_iterations: 10

logging:
  # 是否启用日志系统
  enabled: true
  # 文件日志级别（DEBUG/INFO/WARNING/ERROR）
  level: "DEBUG"
  # 控制台日志级别
  console_level: "INFO"
  # 日志目录（相对运行目录）
  dir: "logs"
  # 日志主文件名（按天滚动，归档形如 sagent.log.2026-07-10）
  file: "sagent.log"
  # 按天滚动保留的历史份数
  backup_count: 7
  # 是否记录 LLM 完整请求/响应内容（关闭时仅记录摘要，避免体积过大与泄露敏感信息）
  log_llm_content: false

context:
  # 模型上下文窗口大小（token 数），按所用模型实际窗口填写
  max_context_tokens: 128000
  # 触发压缩的阈值占比（当前 token / max_context_tokens 超过此值时触发压缩）
  compression_threshold: 0.7
  # 安全线：压缩持续执行直到 token 降至 max_context_tokens * safe_threshold 以下
  safe_threshold: 0.5
  # 始终保留的最近消息条数（第四层滑动窗口裁剪使用）
  keep_recent_messages: 20
  # 单条工具结果的最大 token 数，超过则截断（第一层工具输出截断使用）
  max_tool_output_tokens: 2000
  # token 计数方式：auto（自动选择）/ tiktoken（精确）/ heuristic（字符启发式）
  token_counter_method: "auto"
  # 是否使用 LLM API 返回的 prompt_tokens 做混合校准
  # 启用后每次 LLM 调用自动记录精确 token 数，新增消息仅估算 delta，精度更高且不依赖 tiktoken
  use_api_calibration: true
  # 是否启用第三层 LLM 摘要压缩
  enable_summary: true
  # 第三层 LLM 摘要压缩生成的摘要最大 token 数（注入摘要提示词约束 LLM 输出长度）
  summary_max_tokens: 500

# 会话管理配置（可选，缺省时使用默认值）
# 启用后会话历史将持久化到 SQLite 数据库，支持创建/切换/搜索会话
session:
  # 是否启用会话管理
  enabled: true
  # 会话数据库文件路径（相对运行目录）
  db_path: "sessions.db"
  # 是否启用 FTS5 全文索引（用于历史消息检索，不支持时自动降级为 LIKE 查询）
  enable_fts: true
  # 是否每轮问答后自动增量保存会话消息
  auto_save: true

# 长期记忆配置（可选，缺省时使用默认值）
# 启用后基于两个本地 Markdown 文件持久化跨会话记忆：
#   <dir>/USER.md   用户偏好与环境信息
#   <dir>/MEMORY.md 项目上下文与学习到的经验
# 文件内容为自由格式 Markdown，可直接用编辑器查看与修改
memory:
  # 是否启用长期记忆
  enabled: true
  # 记忆文件所在目录（相对运行目录），USER.md 与 MEMORY.md 均存于此目录
  dir: "memory"
  # 用户文件字符上限，超限时触发 LLM 反思整理（去重、合并冗余、精简表述）
  user_max_chars: 2000
  # 记忆文件字符上限，超限时触发 LLM 反思整理
  memory_max_chars: 4000

# MCP 工具提供者配置（可选，缺省时默认不启用）
# 启用后可连接外部 MCP（Model Context Protocol）服务器，扩展 Agent 的工具能力
# MCP 服务器暴露的工具会以 mcp_{server_name}_{tool_name} 格式注册到工具表
# 支持三种传输方式：stdio（本地子进程）、sse（HTTP 流式）、streamable_http
mcp:
  # 是否启用 MCP 工具提供者
  enabled: false

  # MCP 服务器列表
  servers:
    # 示例 1：stdio 传输（本地子进程）
    # 通过启动子进程并经 stdin/stdout 通信连接
    - name: "filesystem"
      transport: "stdio"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
      env: {}
      cwd: ""
      enabled: true
      # 工具过滤（可选，默认不过滤）
      # allow: 白名单，仅允许列出的工具
      # deny: 黑名单，排除列出的工具
      # 两者均非空时先白名单过滤再排除黑名单
      tool_filter:
        allow: []
        deny: []
      # 连接超时（秒，含握手），默认 30 秒
      connect_timeout: 30
      # 工具调用超时（秒），默认 60 秒
      call_timeout: 60

    # 示例 2：SSE 传输（远程 HTTP 流式）
    # - name: "remote-sse"
    #   transport: "sse"
    #   url: "http://localhost:8080/sse"
    #   enabled: true
    #   tool_filter:
    #     allow: []
    #     deny: []
    #   connect_timeout: 30
    #   call_timeout: 60

    # 示例 3：Streamable HTTP 传输
    # - name: "remote-http"
    #   transport: "streamable_http"
    #   url: "http://localhost:8080/mcp"
    #   enabled: true
    #   tool_filter:
    #     allow: []
    #     deny: []
    #   connect_timeout: 30
    #   call_timeout: 60

    # 示例 4：被禁用的服务器（不会连接）
    # - name: "disabled-server"
    #   transport: "stdio"
    #   command: "some-command"
    #   enabled: false

# 可观测性配置（可选，缺省时使用默认值）
# 启用后提供 Span 树追踪、指标聚合、脱敏和本地 JSON Lines 导出
# 默认本地观测不依赖 OpenTelemetry 包；仅当 otlp_enabled 为 true 时需要安装可选依赖
observability:
  # 是否启用增强观测（关闭时仅保留现有 trace_id 日志）
  enabled: true
  # 本地 Trace 文件目录（相对运行目录）
  trace_dir: "logs"
  # 本地 Trace 文件名（按天滚动，JSON Lines 格式）
  trace_file: "sagent_trace.jsonl"
  # 本地 Metric 文件名（按天滚动，JSON Lines 格式）
  metric_file: "sagent_metrics.jsonl"
  # 是否采集 LLM 诊断内容（prompt/completion 等）
  # 最终有效值需同时满足此开关与 logging.log_llm_content，且始终经过脱敏器
  capture_content: false
  # 采集内容的最大字符长度（超过则截断）
  content_max_length: 500
  # 模型价格表（可选，用于估算成本）
  # 格式：模型名 -> {input_price_per_million: 输入价格, output_price_per_million: 输出价格}（单位：元/百万 token）
  # 缺少价格的模型不计算成本，标记为不可用
  model_pricing: {}
  # 示例：
  # model_pricing:
  #   "gpt-4o-mini":
  #     input_price_per_million: 1.0
  #     output_price_per_million: 4.0
  #   "deepseek-chat":
  #     input_price_per_million: 1.0
  #     output_price_per_million: 2.0
  # 是否启用 OTLP 导出（控制 OTLP 导出器是否加入 provider 链；OTel SDK 为必选依赖，无需额外安装）
  otlp_enabled: false
  # OTLP endpoint 地址
  otlp_endpoint: "http://localhost:4318"
  # OTLP 协议：http 或 grpc
  otlp_protocol: "http"
  # OTLP 导出超时（秒）
  otlp_timeout: 10
  # 指标刷新周期（秒），控制本地 Metric 快照写入频率
  metrics_flush_interval: 60
  # 是否启用 OpenAI SDK 自动埋点（实验性，默认关闭）
  # 首期禁止与手动 gen_ai.chat Span 同时启用，配置为 true 时仅记录警告日志
  enable_openai_auto_instrumentation: false

# 工具调用权限控制配置（可选，缺省时使用默认值）
# 启用后工具执行前经权限闸门统一授权（单点拦截，引擎零改动）：
# - 只读工具（read_file / 记忆工具 / mcp_*）自动放行
# - 写盘与执行类工具（write_file / run_shell 等）需用户确认（y/n/a）
# - run_shell 命中跨平台危险命令清单（Linux shell 与 PowerShell）直接拒绝
# 规则格式为 "工具名" 或 "工具名:参数模式"（fnmatch 通配，如 "run_shell:git push*"）
# 用户规则优先于内置默认，用户显式 allow 可覆盖内置 ask/deny（视为明确授权）
# 跨列表固定优先级 deny > allow > ask：同一请求同时命中多个列表时，拒绝压过放行、放行压过确认
# 同一列表内按书写顺序生效，后写的规则压过先写的（last-match-wins）
permissions:
  # 是否启用权限控制（false 时工具全自动执行，回到旧行为）
  enabled: true
  # 审批等待超时（秒），超时默认拒绝（fail-safe）；缺省 600 秒（10 分钟）
  ask_timeout: 600
  # 非交互终端（无 TTY）或审批超时时的动作：deny（默认拒绝）/ allow（显式放行）
  non_interactive: "deny"
  # 放行规则列表（覆盖内置 ask/deny）
  allow: []
  # 示例：允许所有 git 查询命令与全部 write_file
  # allow:
  #   - "run_shell:git status*"
  #   - "run_shell:git diff*"
  #   - "write_file"
  # 拒绝规则列表
  deny: []
  # 需确认规则列表
  ask: []
